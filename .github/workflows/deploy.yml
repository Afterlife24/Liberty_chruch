name: Deploy Liberty Church to S3 + CloudFront

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload to S3
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --delete --cache-control "max-age=31536000,public"
        env:
          AWS_S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-south-1
          SOURCE_DIR: dist

      - name: Set cache rules (HTML never cached; images, PDFs, sitemap 1 hour)
        run: |
          BUCKET=s3://${{ secrets.S3_BUCKET }}
          # Every page's HTML (index.html, /youth/index.html, 404.html ...) must always be fresh
          aws s3 cp $BUCKET/ $BUCKET/ --recursive --exclude "*" --include "*.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html" \
            --metadata-directive REPLACE
          aws s3 cp $BUCKET/sitemap.xml $BUCKET/sitemap.xml \
            --cache-control "max-age=3600,public" \
            --content-type "application/xml" \
            --metadata-directive REPLACE
          aws s3 cp $BUCKET/robots.txt $BUCKET/robots.txt \
            --cache-control "max-age=3600,public" \
            --content-type "text/plain" \
            --metadata-directive REPLACE
          aws s3 cp $BUCKET/documents/ $BUCKET/documents/ --recursive \
            --cache-control "max-age=3600,public" \
            --content-type "application/pdf" \
            --metadata-directive REPLACE
          # Images: set a 1 hour cache AND keep the correct file type per extension.
          # (Replacing metadata without a content-type turns every image into binary/octet-stream.)
          for pair in "jpg:image/jpeg" "jpeg:image/jpeg" "png:image/png" "gif:image/gif" "webp:image/webp" "svg:image/svg+xml"; do
            ext="${pair%%:*}"
            type="${pair#*:}"
            aws s3 cp $BUCKET/images/ $BUCKET/images/ --recursive \
              --exclude "*" --include "*.$ext" \
              --cache-control "max-age=3600,public" \
              --content-type "$type" \
              --metadata-directive REPLACE
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-south-1

      - name: Invalidate CloudFront cache
        uses: chetan/invalidate-cloudfront-action@v2
        env:
          DISTRIBUTION: ${{ secrets.DISTRIBUTION_ID }}
          PATHS: "/*"
          AWS_REGION: ap-south-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
